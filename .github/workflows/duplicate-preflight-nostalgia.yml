name: Duplicate nostalgia candidate preflight

on:
  push:
    branches:
      - main
    paths:
      - ".duplicate-check-nostalgia/*.json"

permissions:
  contents: write

concurrency:
  group: duplicate-continuity-main
  cancel-in-progress: false

jobs:
  duplicate-preflight-nostalgia:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python for the shared safety guard
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install shared guard HTTP dependency
        run: python -m pip install requests

      - name: Resolve nostalgia preflight request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t request_files < <(
              git show --pretty='' --name-only --diff-filter=A "$AFTER_SHA" -- '.duplicate-check-nostalgia/*.json'
            )
          else
            mapfile -t request_files < <(
              git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '.duplicate-check-nostalgia/*.json'
            )
          fi

          if [[ ${#request_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one newly added nostalgia duplicate preflight request, found ${#request_files[@]}."
            exit 1
          fi

          request_file="${request_files[0]}"
          python - "$request_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import subprocess
          import re
          import sys
          from pathlib import Path

          request_file = Path(sys.argv[1])
          output_file = Path(sys.argv[2])
          data = json.loads(subprocess.check_output(["git", "show", f"{os.environ['AFTER_SHA']}:{request_file.as_posix()}"], text=True, encoding="utf-8"))
          song = str(data.get("song", "")).strip()
          artist = str(data.get("artist", "")).strip()
          request_id = str(data.get("request_id") or request_file.stem).strip()
          if not re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9_-]{0,159}", request_id):
              raise SystemExit("request_id invalido")
          slug = str(data.get("slug", "")).strip()

          if not song or not artist or not slug:
              raise SystemExit("request precisa conter song, artist e slug nao vazios")
          if not re.fullmatch(r"nostalgia_[a-z0-9]+([_-][a-z0-9]+)*", slug):
              raise SystemExit("nostalgia slug invalido: use prefixo nostalgia_")

          with output_file.open("a", encoding="utf-8") as handle:
              handle.write(f"song={song}\n")
              handle.write(f"artist={artist}\n")
              handle.write(f"slug={slug}\n")
              handle.write(f"request_id={request_id}\n")
              handle.write(f"request_file={request_file.as_posix()}\n")
          PY

      - name: Enforce unfinished episode continuity and candidate cap
        id: execution_guard
        env:
          SLUG: ${{ steps.request.outputs.slug }}
          PIPELINE_REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: python scripts/pipeline_workflow.py duplicate-guard "$SLUG" --request-id "$PIPELINE_REQUEST_ID" --channel nostalgia

      - name: Check nostalgia candidate duplicate
        id: duplicate
        if: ${{ steps.execution_guard.outputs.result == 'OPEN' }}
        shell: bash
        env:
          SONG: ${{ steps.request.outputs.song }}
          ARTIST: ${{ steps.request.outputs.artist }}
          SLUG: ${{ steps.request.outputs.slug }}
        run: |
          set +e
          output="$(python check_duplicate.py --song "$SONG" --artist "$ARTIST" --slug "$SLUG" 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [[ $status -eq 0 ]]; then
            echo "PREFLIGHT_RESULT=UNIQUE_CANDIDATE"
            echo "result=UNIQUE_CANDIDATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ $status -eq 2 ]]; then
            echo "PREFLIGHT_RESULT=DUPLICATE_CANDIDATE"
            echo "result=DUPLICATE_CANDIDATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Nostalgia duplicate preflight infrastructure failed with exit code $status."
          exit "$status"

      - name: Persist duplicate decision and bounded continuity
        if: ${{ always() && steps.execution_guard.outcome == 'success' }}
        env:
          SLUG: ${{ steps.request.outputs.slug }}
          PIPELINE_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          DUPLICATE_RESULT: ${{ steps.duplicate.outputs.result }}
        run: |
          set -euo pipefail
          python scripts/pipeline_workflow.py duplicate-result "$SLUG" --result "$DUPLICATE_RESULT"
          python scripts/pipeline_workflow.py release "$SLUG"

      - name: Write nostalgia preflight summary
        if: always()
        shell: bash
        env:
          GUARD_RESULT: ${{ steps.execution_guard.outputs.result }}
          DUPLICATE_RESULT: ${{ steps.duplicate.outputs.result }}
          LATEST_QUEUE_COMMIT: ${{ steps.execution_guard.outputs.latest_queue_commit }}
          RESUME_SLUG: ${{ steps.execution_guard.outputs.resume_slug }}
          CONTINUITY_SLUGS: ${{ steps.execution_guard.outputs.continuity_slugs }}
          CANDIDATE_ATTEMPTS: ${{ steps.execution_guard.outputs.candidate_attempts }}
          CANDIDATE_LIMIT: ${{ steps.execution_guard.outputs.candidate_limit }}
          SONG: ${{ steps.request.outputs.song }}
          ARTIST: ${{ steps.request.outputs.artist }}
          SLUG: ${{ steps.request.outputs.slug }}
        run: |
          result="$GUARD_RESULT"
          if [[ "$GUARD_RESULT" == "OPEN" ]]; then
            result="$DUPLICATE_RESULT"
          fi
          {
            echo "## Duplicate nostalgia candidate preflight"
            echo
            echo "- Result: ${result:-INFRA_FAILURE}"
            echo "- Latest nostalgia publish queue boundary: ${LATEST_QUEUE_COMMIT:-NONE}"
            echo "- Candidate attempts: ${CANDIDATE_ATTEMPTS:-N/A}/${CANDIDATE_LIMIT:-15}"
            echo "- Requested song: $SONG"
            echo "- Requested artist: $ARTIST"
            echo "- Requested slug: $SLUG"
            echo "- Resume nostalgia slug: ${RESUME_SLUG:-N/A}"
            echo "- Nostalgia continuity slugs: ${CONTINUITY_SLUGS:-N/A}"
            echo "- Normal episodes: intentionally ignored by this workflow"
            if [[ "$result" == "CANDIDATE_LIMIT_REACHED" ]]; then
              echo "- Final status: SEM_CANDIDATO"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: DUPLICATE_PREFLIGHT_NOSTALGIA
          PIPELINE_SLUG: ${{ env.EPISODE }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py

      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
