name: Recovery prepare

on:
  push:
    branches:
      - main
    paths:
      - ".recovery-request/*.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: recovery-prepare-main
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.request.outputs.slug }}
      previous_request_id: ${{ steps.request.outputs.previous_request_id }}
      request_id: ${{ steps.request.outputs.request_id }}
      source_sha: ${{ steps.recover.outputs.source_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve recovery request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t files < <(git show --pretty='' --name-only --diff-filter=A "$AFTER_SHA" -- '.recovery-request/*.json')
          else
            mapfile -t files < <(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '.recovery-request/*.json')
          fi
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::RECOVERY_REQUEST_INVALID: expected exactly one new .recovery-request file; found ${#files[@]}"
            exit 1
          fi
          file="${files[0]}"
          python - "$file" "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          slug = str(data.get("slug", "")).strip()
          previous = str(data.get("previous_request_id", "")).strip()
          request_id = str(data.get("request_id", "")).strip()
          cycle = data.get("repair_cycle")
          safe_slug = r"[a-z0-9]+([_-][a-z0-9]+)*"
          safe_request = r"[a-zA-Z0-9][a-zA-Z0-9_-]{0,159}"
          if not re.fullmatch(safe_slug, slug):
              raise SystemExit("invalid slug")
          if not re.fullmatch(safe_request, previous):
              raise SystemExit("invalid previous_request_id")
          if not re.fullmatch(safe_request, request_id) or request_id == previous:
              raise SystemExit("invalid/fresh request_id required")
          if cycle not in (1, 2, 3):
              raise SystemExit("repair_cycle must be 1, 2 or 3")
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              handle.write(f"file={path.as_posix()}\n")
              handle.write(f"slug={slug}\n")
              handle.write(f"previous_request_id={previous}\n")
              handle.write(f"request_id={request_id}\n")
              handle.write(f"repair_cycle={cycle}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply fenced repair and prepare correlated media request
        id: recover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_DEFAULT_GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_ACTIONS_PREPARE_AUTH: workflow-dispatch
          PIPELINE_REQUEST_ID: ${{ steps.request.outputs.previous_request_id }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          python scripts/recover_episode_request.py "${{ steps.request.outputs.file }}" | tee "$output_file"
          python scripts/parse_prepare_output.py "$output_file" \
            "${{ steps.request.outputs.slug }}" "${{ steps.request.outputs.request_id }}" "$GITHUB_OUTPUT"

      - name: Dispatch correlated media preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.request.outputs.slug }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SOURCE_SHA: ${{ steps.recover.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh workflow run episode-media-preflight.yml --ref main \
            -f episode="$SLUG" -f request_id="$REQUEST_ID" -f source_sha="$SOURCE_SHA"

      - name: Summary
        if: always()
        run: |
          echo "## Recovery prepare" >> "$GITHUB_STEP_SUMMARY"
          echo "- slug: ${{ steps.request.outputs.slug }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- previous_request_id: ${{ steps.request.outputs.previous_request_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- request_id: ${{ steps.request.outputs.request_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- repair_cycle: ${{ steps.request.outputs.repair_cycle }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source_sha: ${{ steps.recover.outputs.source_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- handoff: correlated workflow_dispatch with native GITHUB_TOKEN" >> "$GITHUB_STEP_SUMMARY"
