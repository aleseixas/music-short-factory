name: Episode media preflight

on:
  push:
    branches:
      - main
    paths:
      - ".episode-check/*.json"

permissions:
  contents: write
  actions: write

jobs:
  media-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve preflight request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t files < <(git show --pretty='' --name-only --diff-filter=A "$AFTER_SHA" -- '.episode-check/*.json')
          else
            mapfile -t files < <(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '.episode-check/*.json')
          fi
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::PREFLIGHT_REQUEST_INVALID: expected exactly one new .episode-check request; found ${#files[@]}. ACTION: create exactly one new request file and keep the same episode slug."
            exit 1
          fi
          file="${files[0]}"
          slug="$(python - "$file" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          slug=str(data.get('slug','')).strip()
          print(slug)
          PY
          )"
          if [[ ! "$slug" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]]; then
            echo "::error::PREFLIGHT_SLUG_INVALID: invalid episode slug in request. TARGET: $file. ACTION: fix only the slug format; do not create a new topic."
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Media preflight episode: $slug"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js for visual recovery
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and auto-repair episode media
        id: repair
        shell: bash
        env:
          EPISODE: ${{ steps.request.outputs.slug }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -uo pipefail
          max_attempts=5
          diagnostics_dir="ci-diagnostics/media-preflight-${GITHUB_RUN_ID}"
          mkdir -p "$diagnostics_dir"

          emit_failure_summary() {
            local log_file="$1"
            local reason="$2"
            local code detail recoverable target action same_slug error_class

            code="$(grep '^MEDIA_PREFLIGHT_ERROR_CODE=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            error_class="$(grep '^MEDIA_PREFLIGHT_ERROR_CLASS=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            detail="$(grep '^MEDIA_PREFLIGHT_ERROR_DETAIL=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            recoverable="$(grep '^MEDIA_PREFLIGHT_RECOVERABLE=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            target="$(grep '^MEDIA_PREFLIGHT_TARGET=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            action="$(grep '^MEDIA_PREFLIGHT_RECOMMENDED_ACTION=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            same_slug="$(grep '^MEDIA_PREFLIGHT_SAME_SLUG=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"

            code="${code:-UNSTRUCTURED_FAILURE}"
            error_class="${error_class:-UNKNOWN}"
            detail="${detail:-The failing command did not emit a structured detail. Inspect the traceback immediately above.}"
            recoverable="${recoverable:-unknown}"
            target="${target:-unknown}"
            action="${action:-Inspect the traceback, fix the named cause, keep the same slug, and do not create the publish queue until PASS.}"
            same_slug="${same_slug:-$EPISODE}"

            echo "MEDIA_PREFLIGHT_FINAL_ERROR_CODE=$code"
            echo "MEDIA_PREFLIGHT_FINAL_ERROR_CLASS=$error_class"
            echo "MEDIA_PREFLIGHT_FINAL_ERROR_DETAIL=$detail"
            echo "MEDIA_PREFLIGHT_FINAL_RECOVERABLE=$recoverable"
            echo "MEDIA_PREFLIGHT_FINAL_TARGET=$target"
            echo "MEDIA_PREFLIGHT_FINAL_RECOMMENDED_ACTION=$action"
            echo "MEDIA_PREFLIGHT_FINAL_SAME_SLUG=$same_slug"
            echo "::error::MEDIA PREFLIGHT [$code] $detail TARGET: $target. RECOVERABLE: $recoverable. ACTION: $action SAME_SLUG: $same_slug. REASON: $reason"

            {
              echo "MEDIA_PREFLIGHT_RESULT=FAIL"
              echo "MEDIA_PREFLIGHT_REASON=$reason"
              echo "MEDIA_PREFLIGHT_ERROR_CODE=$code"
              echo "MEDIA_PREFLIGHT_ERROR_CLASS=$error_class"
              echo "MEDIA_PREFLIGHT_ERROR_DETAIL=$detail"
              echo "MEDIA_PREFLIGHT_RECOVERABLE=$recoverable"
              echo "MEDIA_PREFLIGHT_TARGET=$target"
              echo "MEDIA_PREFLIGHT_RECOMMENDED_ACTION=$action"
              echo "MEDIA_PREFLIGHT_SAME_SLUG=$same_slug"
              echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
              echo "GITHUB_SHA=$GITHUB_SHA"
            } > "$diagnostics_dir/final-result.txt"

            {
              echo "## Media preflight failure"
              echo ""
              echo "- **Episode:** \`$same_slug\`"
              echo "- **Error code:** \`$code\`"
              echo "- **Exception:** \`$error_class\`"
              echo "- **Detail:** $detail"
              echo "- **Recoverable:** \`$recoverable\`"
              echo "- **Target to change:** \`$target\`"
              echo "- **Recommended action:** $action"
              echo "- **Continuity rule:** keep this same slug; do not author a replacement topic because of this failure."
              echo "- **Persistent diagnostics:** artifact \`media-preflight-diagnostics-$GITHUB_RUN_ID\`."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          for attempt in $(seq 1 "$max_attempts"); do
            echo "===== MEDIA PREFLIGHT attempt $attempt/$max_attempts ====="
            log_file="$diagnostics_dir/attempt-${attempt}.log"
            : > "$log_file"

            set +e
            python check_episode_media.py "$EPISODE" 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [[ $status -eq 0 ]] && grep -q '^MEDIA_PREFLIGHT_RESULT=PASS$' "$log_file"; then
              echo "MEDIA_AUTO_RECOVERY=PASS attempt=$attempt"
              {
                echo "MEDIA_PREFLIGHT_RESULT=PASS"
                echo "MEDIA_PREFLIGHT_ATTEMPT=$attempt"
                echo "MEDIA_PREFLIGHT_SAME_SLUG=$EPISODE"
                echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
                echo "GITHUB_SHA=$GITHUB_SHA"
              } > "$diagnostics_dir/final-result.txt"
              exit 0
            fi

            error_code="$(grep '^MEDIA_PREFLIGHT_ERROR_CODE=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            recoverable="$(grep '^MEDIA_PREFLIGHT_RECOVERABLE=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"

            if [[ $attempt -ge $max_attempts ]]; then
              emit_failure_summary "$log_file" "attempts_exhausted"
              cat "$log_file"
              exit 1
            fi

            repaired=0

            case "$error_code" in
              BACKGROUND_MUSIC_REUSE|BACKGROUND_MUSIC_INVALID)
                echo "AUTO_REPAIR_STRATEGY=BACKGROUND_MUSIC_RESELECT error_code=$error_code"
                if python scripts/repair_background_music.py "$EPISODE"; then
                  repaired=1
                fi
                ;;
              INTRA_EPISODE_VISUAL_REUSE|VISUAL_ASSET_HTTP_403|VISUAL_ASSET_HTTP_404|VISUAL_ASSET_INVALID|SHOT_REFERENCES_MISSING_ASSET|MEDIA_PROBE_OR_CODEC_ERROR)
                echo "AUTO_REPAIR_STRATEGY=VISUAL_RESELECT error_code=$error_code"
                python resolve_visual_candidates.py "$EPISODE" || true
                python resolve_visual_candidates_web_auth.py "$EPISODE" || true
                if ! git diff --quiet -- "episodes/$EPISODE"; then
                  repaired=1
                fi
                ;;
              *)
                # Backwards-compatible fallback for older/unstructured validators.
                if grep -Eq 'BACKGROUND_REUSE_BLOCKED|Nenhuma faixa do profile de background music|background music.*(falhou|invalido|ausente)|Profile de background music inexistente' "$log_file"; then
                  echo "AUTO_REPAIR_STRATEGY=BACKGROUND_MUSIC_RESELECT legacy_match=true"
                  if python scripts/repair_background_music.py "$EPISODE"; then
                    repaired=1
                  fi
                fi

                if grep -Eq 'INTRA_EPISODE_VISUAL_REUSE_BLOCKED|Asset .*ausente|Asset de video .*ausente|Asset de video invalido|Arquivo nao e uma imagem valida|asset de imagem|asset de video|HTTP Error|HTTP [45][0-9][0-9]|404|403' "$log_file"; then
                  echo "AUTO_REPAIR_STRATEGY=VISUAL_RESELECT legacy_match=true"
                  python resolve_visual_candidates.py "$EPISODE" || true
                  python resolve_visual_candidates_web_auth.py "$EPISODE" || true
                  if ! git diff --quiet -- "episodes/$EPISODE"; then
                    repaired=1
                  fi
                fi
                ;;
            esac

            if [[ "$recoverable" == "false" ]]; then
              repaired=0
            fi

            if [[ $repaired -ne 1 ]]; then
              emit_failure_summary "$log_file" "no_safe_auto_repair_applied"
              exit 1
            fi

            echo "Recovery applied; re-running the full media preflight for SAME_SLUG=$EPISODE."
          done

          echo "::error::MEDIA_PREFLIGHT_INTERNAL_LOOP_ERROR: unexpected recovery loop termination. ACTION: inspect workflow logic; do not queue or change episode topic."
          exit 1

      - name: Upload media preflight diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: media-preflight-diagnostics-${{ github.run_id }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Persist repairs and create publish queue
        id: queue
        shell: bash
        env:
          EPISODE: ${{ steps.request.outputs.slug }}
        run: |
          set -euo pipefail

          queue_file=".publish-queue/$EPISODE.txt"
          mkdir -p .publish-queue
          should_dispatch=false

          if [[ ! -f "$queue_file" ]]; then
            printf '%s\n' "$EPISODE" > "$queue_file"
            should_dispatch=true
            echo "Created publish queue: $queue_file"
          else
            echo "Publish queue already exists: $queue_file; publication will not be dispatched again."
          fi
          echo "should_dispatch=$should_dispatch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "episodes/$EPISODE" "$queue_file"

          if git diff --cached --quiet; then
            echo "No episode/queue changes to commit."
            exit 0
          fi

          git commit -m "Auto-repair media and queue $EPISODE"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch publish workflow
        if: ${{ steps.queue.outputs.should_dispatch == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ steps.request.outputs.slug }}
        run: |
          set -euo pipefail
          echo "Dispatching Publish episode for $EPISODE after exact media preflight PASS."
          gh workflow run publish-episode.yml --ref main -f episode="$EPISODE"
