name: Episode media preflight
run-name: ${{ github.event_name == 'workflow_dispatch' && format('media/{0}/{1}/{2}', inputs.episode, inputs.request_id, inputs.source_sha) || github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    paths:
      - ".episode-check/*.json"
  workflow_dispatch:
    inputs:
      episode:
        description: Reserved episode slug
        required: true
        type: string
      request_id:
        description: Exact reserved request id
        required: true
        type: string
      source_sha:
        description: Exact CAS commit containing the prepared episode request
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: episode-media-preflight-main
  cancel-in-progress: false

jobs:
  media-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      episode: ${{ steps.request.outputs.slug }}
      request_id: ${{ steps.request.outputs.request_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve preflight request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_EPISODE: ${{ inputs.episode }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$MANUAL_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::PREFLIGHT_SOURCE_SHA_INVALID"
              exit 1
            fi
            if [[ ! "$MANUAL_EPISODE" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]]; then
              echo "::error::PREFLIGHT_SLUG_INVALID"
              exit 1
            fi
            if [[ ! "$MANUAL_REQUEST_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,159}$ ]]; then
              echo "::error::PREFLIGHT_REQUEST_ID_INVALID"
              exit 1
            fi
            file=".episode-check/${MANUAL_EPISODE}--${MANUAL_REQUEST_ID}.json"
            if [[ ! -f "$file" ]]; then
              echo "::error::PREFLIGHT_REQUEST_MISSING: $file not present at source_sha=$MANUAL_SOURCE_SHA"
              exit 1
            fi
          else
            if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              mapfile -t files < <(git show --pretty='' --name-only --diff-filter=A "$AFTER_SHA" -- '.episode-check/*.json')
            else
              mapfile -t files < <(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '.episode-check/*.json')
            fi
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "::error::PREFLIGHT_REQUEST_INVALID: expected exactly one new .episode-check request; found ${#files[@]}."
              exit 1
            fi
            file="${files[0]}"
          fi

          python - "$file" "$GITHUB_OUTPUT" "$EVENT_NAME" "$MANUAL_EPISODE" "$MANUAL_REQUEST_ID" "$MANUAL_SOURCE_SHA" "$AFTER_SHA" <<'PY'
          import json, re, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          out=Path(sys.argv[2])
          event=sys.argv[3]
          expected_slug=sys.argv[4]
          expected_request=sys.argv[5]
          source_sha=sys.argv[6] if event == "workflow_dispatch" else sys.argv[7]
          data=json.loads(path.read_text(encoding="utf-8"))
          slug=str(data.get("slug","")).strip()
          request_id=str(data.get("request_id") or path.stem).strip()
          if not re.fullmatch(r"[a-z0-9]+([_-][a-z0-9]+)*", slug):
              raise SystemExit("PREFLIGHT_SLUG_INVALID")
          if not re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9_-]{0,159}", request_id):
              raise SystemExit("PREFLIGHT_REQUEST_ID_INVALID")
          if event == "workflow_dispatch" and (slug != expected_slug or request_id != expected_request):
              raise SystemExit("PREFLIGHT_REQUEST_IDENTITY_MISMATCH")
          if path.as_posix() != f".episode-check/{slug}--{request_id}.json":
              raise SystemExit("PREFLIGHT_REQUEST_PATH_MISMATCH")
          if data.get("workflow") != "episode-media-preflight.yml" or data.get("local_preflight_passed") is not True:
              raise SystemExit("PREFLIGHT_REQUEST_NOT_PREPARED")
          with out.open("a", encoding="utf-8") as handle:
              handle.write(f"request_id={request_id}\n")
              handle.write(f"slug={slug}\n")
              handle.write(f"request_file={path.as_posix()}\n")
              handle.write(f"source_sha={source_sha}\n")
          print(f"Media preflight episode: {slug}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js for visual recovery
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Admit exact prepared request and claim this run by CAS
        shell: bash
        env:
          EPISODE: ${{ steps.request.outputs.slug }}
          PIPELINE_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          PIPELINE_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          python scripts/admit_media_preflight.py

      - name: Episode media preflight — batch diagnostics and auto-repair
        id: repair
        shell: bash
        env:
          EPISODE: ${{ steps.request.outputs.slug }}
          PIPELINE_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          PIPELINE_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # runner context is available at step scope, not at job.env scope.
          # Share failures across batch/repair subprocesses, never across runs.
          AUDIO_PROVIDER_CIRCUIT_STATE: ${{ runner.temp }}/music-provider-circuit-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          set -uo pipefail
          python scripts/pipeline_workflow.py assert-unstarted "$EPISODE" || exit 1
          # Each pass collects all independent failures it can observe. Repairs are
          # applied as one batch before the next full validation. Extra passes remain
          # only for dependent errors that can become visible after another repair.
          max_attempts=10
          diagnostics_dir="ci-diagnostics/media-preflight-${GITHUB_RUN_ID}"
          mkdir -p "$diagnostics_dir"

          emit_failure_summary() {
            local log_file="$1"
            local code detail recoverable target action same_slug error_class error_count errors_json

            code="$(grep '^MEDIA_PREFLIGHT_ERROR_CODE=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            error_class="$(grep '^MEDIA_PREFLIGHT_ERROR_CLASS=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            detail="$(grep '^MEDIA_PREFLIGHT_ERROR_DETAIL=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            recoverable="$(grep '^MEDIA_PREFLIGHT_RECOVERABLE=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            target="$(grep '^MEDIA_PREFLIGHT_TARGET=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            action="$(grep '^MEDIA_PREFLIGHT_RECOMMENDED_ACTION=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            same_slug="$(grep '^MEDIA_PREFLIGHT_SAME_SLUG=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            error_count="$(grep '^MEDIA_PREFLIGHT_ERROR_COUNT=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            errors_json="$(grep '^MEDIA_PREFLIGHT_ERRORS_JSON=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"

            if [[ "$code" == "UNCLASSIFIED_ENGINE_ERROR" || "$code" == "UNSTRUCTURED_FAILURE" ]]; then
              code=""
              recoverable=""
              target=""
              action=""
            fi
            if [[ "$same_slug" == "UNKNOWN" ]]; then
              same_slug="$EPISODE"
            fi
            same_slug="${same_slug:-$EPISODE}"

            if [[ -n "$detail" && -n "$error_class" && "$detail" == "$error_class" && -z "$code" ]]; then
              detail=""
            fi

            echo "MEDIA_PREFLIGHT_STATUS=FAIL"
            [[ -n "$error_count" ]] && echo "MEDIA_PREFLIGHT_ERROR_COUNT=$error_count"
            [[ -n "$errors_json" ]] && echo "MEDIA_PREFLIGHT_ERRORS_JSON=$errors_json"
            [[ -n "$error_class" ]] && echo "MEDIA_PREFLIGHT_ERROR_CLASS=$error_class"
            [[ -n "$code" ]] && echo "MEDIA_PREFLIGHT_ERROR_CODE=$code"
            [[ -n "$detail" ]] && echo "MEDIA_PREFLIGHT_ERROR_DETAIL=$detail"
            [[ -n "$recoverable" ]] && echo "MEDIA_PREFLIGHT_RECOVERABLE=$recoverable"
            [[ -n "$target" ]] && echo "MEDIA_PREFLIGHT_TARGET=$target"
            [[ -n "$action" ]] && echo "MEDIA_PREFLIGHT_RECOMMENDED_ACTION=$action"
            echo "MEDIA_PREFLIGHT_SAME_SLUG=$same_slug"

            if [[ -n "$detail" ]]; then
              annotation="$detail"
              [[ -n "$error_class" ]] && annotation="$error_class: $annotation"
              [[ -n "$code" ]] && annotation="[$code] $annotation"
              echo "::error::$annotation"
            else
              echo "MEDIA_PREFLIGHT_DIAGNOSTIC_MISSING=true"
            fi

            {
              echo "MEDIA_PREFLIGHT_STATUS=FAIL"
              [[ -n "$error_count" ]] && echo "MEDIA_PREFLIGHT_ERROR_COUNT=$error_count"
              [[ -n "$errors_json" ]] && echo "MEDIA_PREFLIGHT_ERRORS_JSON=$errors_json"
              [[ -n "$error_class" ]] && echo "MEDIA_PREFLIGHT_ERROR_CLASS=$error_class"
              [[ -n "$code" ]] && echo "MEDIA_PREFLIGHT_ERROR_CODE=$code"
              [[ -n "$detail" ]] && echo "MEDIA_PREFLIGHT_ERROR_DETAIL=$detail"
              [[ -n "$recoverable" ]] && echo "MEDIA_PREFLIGHT_RECOVERABLE=$recoverable"
              [[ -n "$target" ]] && echo "MEDIA_PREFLIGHT_TARGET=$target"
              [[ -n "$action" ]] && echo "MEDIA_PREFLIGHT_RECOMMENDED_ACTION=$action"
              echo "MEDIA_PREFLIGHT_SAME_SLUG=$same_slug"
              [[ -z "$detail" ]] && echo "MEDIA_PREFLIGHT_DIAGNOSTIC_MISSING=true"
              echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
              echo "GITHUB_SHA=$GITHUB_SHA"
            } > "$diagnostics_dir/final-result.txt"

            {
              echo "## Media preflight diagnostic"
              echo ""
              echo "- **Episode:** \`$same_slug\`"
              [[ -n "$error_count" ]] && echo "- **Errors collected in final pass:** \`$error_count\`"
              [[ -n "$code" ]] && echo "- **First exact error code (legacy field):** \`$code\`"
              [[ -n "$error_class" ]] && echo "- **First exception class:** \`$error_class\`"
              [[ -n "$detail" ]] && echo "- **First root error detail:** $detail"
              [[ -n "$recoverable" ]] && echo "- **First recoverable:** \`$recoverable\`"
              [[ -n "$target" ]] && echo "- **First target to change:** \`$target\`"
              [[ -n "$action" ]] && echo "- **First recommended action:** $action"
              if [[ -n "$errors_json" ]]; then
                echo "- **Batch diagnostics:** available in \`MEDIA_PREFLIGHT_ERRORS_JSON\` and \`MEDIA_PREFLIGHT_ERROR_ITEM\` lines inside the raw attempt log."
              fi
              if [[ -z "$detail" ]]; then
                echo "- **Diagnostic state:** no exact exception detail was captured; no generic cause was substituted."
              fi
              echo "- **Raw diagnostics:** artifact \`media-preflight-diagnostics-$GITHUB_RUN_ID\`."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          for attempt in $(seq 1 "$max_attempts"); do
            echo "===== MEDIA PREFLIGHT batch pass $attempt/$max_attempts ====="
            log_file="$diagnostics_dir/attempt-${attempt}.log"
            : > "$log_file"

            set +e
            python check_episode_media_batch.py "$EPISODE" --json-report "$diagnostics_dir/latest.json" > "$log_file" 2>&1
            status=$?
            set -e

            cat "$log_file"

            if [[ $status -eq 0 ]] && grep -q '^MEDIA_PREFLIGHT_RESULT=PASS$' "$log_file"; then
              python scripts/pipeline_workflow.py media-pass "$EPISODE" --request-id "$PIPELINE_REQUEST_ID" || exit 1
              echo "MEDIA_AUTO_RECOVERY=PASS attempt=$attempt"
              {
                echo "MEDIA_PREFLIGHT_STATUS=PASS"
                echo "MEDIA_PREFLIGHT_ATTEMPT=$attempt"
                echo "MEDIA_PREFLIGHT_ERROR_COUNT=0"
                echo "MEDIA_PREFLIGHT_SAME_SLUG=$EPISODE"
                echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
                echo "GITHUB_SHA=$GITHUB_SHA"
              } > "$diagnostics_dir/final-result.txt"
              exit 0
            fi

            error_code="$(grep '^MEDIA_PREFLIGHT_ERROR_CODE=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            recoverable="$(grep '^MEDIA_PREFLIGHT_RECOVERABLE=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            error_count="$(grep '^MEDIA_PREFLIGHT_ERROR_COUNT=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"
            errors_json="$(grep '^MEDIA_PREFLIGHT_ERRORS_JSON=' "$log_file" | tail -n 1 | cut -d= -f2- || true)"

            echo "MEDIA_PREFLIGHT_BATCH_COUNT=${error_count:-unknown}"

            if [[ $attempt -ge $max_attempts ]]; then
              emit_failure_summary "$log_file"
              exit 1
            fi

            repaired=0
            # Revalidate after all safe changes even if another error remains
            # unrecoverable. Report files alone never count as a repair.
            before_fingerprint="$(python -c 'from engine.pipeline_runtime import episode_fingerprint; from pathlib import Path; import sys; print(episode_fingerprint(Path.cwd(), sys.argv[1]))' "$EPISODE")"
            if [[ -n "$errors_json" ]]; then
              echo "AUTO_REPAIR_STRATEGY=BATCH error_count=${error_count:-unknown}"
              python scripts/repair_media_preflight_batch.py "$EPISODE" --diagnostic-log "$log_file" || true
            fi
            after_fingerprint="$(python -c 'from engine.pipeline_runtime import episode_fingerprint; from pathlib import Path; import sys; print(episode_fingerprint(Path.cwd(), sys.argv[1]))' "$EPISODE")"
            if [[ "$before_fingerprint" != "$after_fingerprint" ]]; then
              repaired=1
            fi

            if [[ $repaired -ne 1 ]]; then
              emit_failure_summary "$log_file"
              exit 1
            fi

            echo "Batch recovery applied; re-running full media preflight for SAME_SLUG=$EPISODE only to catch dependent/new errors."
          done

          echo "::error::Workflow invariant violated: media preflight loop terminated without PASS or a captured failure diagnostic."
          exit 1

      - name: Upload media preflight diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: media-preflight-diagnostics-${{ github.run_id }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 1

      - name: Persist media repairs
        id: source
        shell: bash
        env:
          EPISODE: ${{ steps.request.outputs.slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/pipeline_workflow.py persist "$EPISODE"

      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: MEDIA_PREFLIGHT
          PIPELINE_SLUG: ${{ steps.request.outputs.slug }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py

      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  resolve-visuals:
    needs: media-preflight
    runs-on: ${{ vars.USE_SELF_HOSTED_VISUALS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    env:
      EPISODE: ${{ needs.media-preflight.outputs.episode }}
      PIPELINE_REQUEST_ID: ${{ needs.media-preflight.outputs.request_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repaired episode
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.media-preflight.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js for yt-dlp EJS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure FFmpeg on GitHub-hosted runner
        if: ${{ vars.USE_SELF_HOSTED_VISUALS != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi

          while IFS= read -r source; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done < <(find /etc/apt/sources.list.d -maxdepth 1 -type f -print)

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1

      - name: Verify FFmpeg on self-hosted runner
        if: ${{ vars.USE_SELF_HOSTED_VISUALS == 'true' }}
        run: ffmpeg -version

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Reconcile authoritative reservation
        env:
          EPISODE: ${{ env.EPISODE }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pipeline_workflow.py reconcile "$EPISODE"

      - name: Verify visual download stack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yt_dlp
          print(f"yt-dlp: {yt_dlp.version.__version__}")
          PY
          node --version
          ffmpeg -version | head -n 1

      - name: Show visual runner mode
        env:
          USE_SELF_HOSTED_VISUALS: ${{ vars.USE_SELF_HOSTED_VISUALS }}
        run: python -c "import os, socket; print('Visual runner:', 'self-hosted/residential' if os.getenv('USE_SELF_HOSTED_VISUALS') == 'true' else 'github-hosted'); print('Host:', socket.gethostname())"

      - name: Score and resolve final visual candidates
        id: visuals
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        shell: bash
        run: |
          set -euo pipefail
          # A failed resolver must never be masked by a report from an older run.
          rm -f "episodes/$EPISODE/visual_resolution_report.json"
          python resolve_visual_candidates_web_auth.py "$EPISODE"

      - name: Enforce final visual semantics and stage handoff
        run: python scripts/stage_visual_handoff.py

      - name: Upload resolved visual handoff
        uses: actions/upload-artifact@v7
        with:
          name: visual-handoff-${{ needs.media-preflight.outputs.episode }}
          path: .visual-handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: RESOLVE_VISUALS
          PIPELINE_SLUG: ${{ env.EPISODE }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py

      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  render-preflight:
    needs:
      - media-preflight
      - resolve-visuals
    runs-on: ubuntu-latest
    env:
      EPISODE: ${{ needs.media-preflight.outputs.episode }}
      PIPELINE_REQUEST_ID: ${{ needs.media-preflight.outputs.request_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repaired episode
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.media-preflight.outputs.source_sha }}
          fetch-depth: 0

      - name: Download resolved visual handoff
        uses: actions/download-artifact@v7
        with:
          name: visual-handoff-${{ needs.media-preflight.outputs.episode }}
          path: .visual-handoff

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js for render-time yt-dlp EJS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
            exit 0
          fi

          while IFS= read -r source; do
            if sudo grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done < <(find /etc/apt/sources.list.d -maxdepth 1 -type f -print)

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Reconcile authoritative reservation
        env:
          EPISODE: ${{ env.EPISODE }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pipeline_workflow.py reconcile "$EPISODE"

      - name: Apply resolved visual handoff
        shell: bash
        run: |
          set -euo pipefail
          payload=".visual-handoff/episodes/$EPISODE"
          if [[ ! -d "$payload" ]]; then
            echo "::error::VISUAL_HANDOFF_MISSING: artifact has no payload for $EPISODE."
            exit 1
          fi
          cp -R "$payload/." "episodes/$EPISODE/"
          echo "Applied final visual handoff for $EPISODE."

      - name: Revalidate final media after visual resolution
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          AUDIO_PROVIDER_CIRCUIT_STATE: ${{ runner.temp }}/music-provider-circuit-${{ github.run_id }}-${{ github.run_attempt }}-final.json
        run: python check_episode_media_batch.py "$EPISODE"

      - name: Render complete episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python generate.py "$EPISODE"

      - name: Prepare publishing metadata and cover
        run: python prepare_post.py "$EPISODE"

      - name: Validate every platform locally without publishing
        run: python publish.py "$EPISODE" --platform all --dry-run

      - name: Validate final media and create publish-ready bundle
        env:
          PREFLIGHT_SOURCE_RUN_ID: ${{ github.run_id }}
          PREFLIGHT_SOURCE_SHA: ${{ needs.media-preflight.outputs.source_sha }}
        run: python scripts/publish_ready_bundle.py create "$EPISODE" --bundle-dir .publish-ready

      - name: Upload mandatory publish-ready artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish-ready-${{ needs.media-preflight.outputs.episode }}
          path: .publish-ready
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
          compression-level: 0

      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: RENDER_PREFLIGHT
          PIPELINE_SLUG: ${{ env.EPISODE }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py

      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  queue-publication:
    needs:
      - media-preflight
      - render-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      EPISODE: ${{ needs.media-preflight.outputs.episode }}
      PIPELINE_REQUEST_ID: ${{ needs.media-preflight.outputs.request_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up queue coordination dependencies
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install requests

      - name: Create publish queue only after render preflight passes
        id: queue
        run: python scripts/pipeline_workflow.py queue "$EPISODE" --request-id "$PIPELINE_REQUEST_ID"

      - name: Dispatch publication of validated artifact or observe its existing request
        run: python scripts/dispatch_publication.py

      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: QUEUE_PUBLICATION
          PIPELINE_SLUG: ${{ env.EPISODE }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py

      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  record-preflight-failure:
    needs: [media-preflight, resolve-visuals, render-preflight]
    if: ${{ always() && needs.media-preflight.outputs.episode != '' && (needs.media-preflight.result == 'failure' || needs.resolve-visuals.result == 'failure' || needs.render-preflight.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EPISODE: ${{ needs.media-preflight.outputs.episode }}
      PIPELINE_REQUEST_ID: ${{ needs.media-preflight.outputs.request_id }}
      PIPELINE_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install requests
      - name: Persist failure for the same request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/pipeline_workflow.py reconcile "$EPISODE"
          python scripts/pipeline_workflow.py media-failed "$EPISODE"
          python scripts/pipeline_workflow.py release "$EPISODE"
      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: RECORD_PREFLIGHT_FAILURE
          PIPELINE_SLUG: ${{ env.EPISODE }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py
      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
