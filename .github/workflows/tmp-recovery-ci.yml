name: Temporary recovery architecture CI

on:
  push:
    branches:
      - feat/actions-recovery-token

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile changed Python
        run: |
          python -m py_compile engine/pipeline_runtime.py
          python -m py_compile scripts/recover_episode_request.py
          python -m py_compile tests/test_recover_episode_request.py
          python -m py_compile tests/test_mutation_fencing.py
          python -m py_compile tests/test_media_preflight_workflows.py
      - name: Run focused recovery tests
        run: |
          python -m pytest -q tests/test_recover_episode_request.py tests/test_media_preflight_workflows.py
          python -m pytest -q tests/test_mutation_fencing.py -k actions_prepare
