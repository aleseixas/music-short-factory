name: Publish episode
run-name: ${{ github.event_name == 'workflow_dispatch' && format('publish/{0}/{1}/{2}', inputs.episode, inputs.request_id, inputs.source_run_id) || github.event.head_commit.message }}

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode slug (for example, duckworth)
        required: true
        type: string
      request_id:
        description: Pipeline request correlation ID
        required: false
        type: string
      source_run_id:
        description: Successful Episode media preflight run containing publish-ready-<episode>
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".publish-queue/*.txt"
      - ".publish-retry/*.txt"

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      episode: ${{ steps.episode.outputs.slug }}
      trigger_kind: ${{ steps.episode.outputs.trigger_kind }}
      source_run_id: ${{ steps.episode.outputs.source_run_id }}
      request_id: ${{ steps.episode.outputs.request_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve validated episode artifact
        id: episode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EPISODE: ${{ inputs.episode }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}
          MANUAL_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          trim() {
            printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          trigger_kind="manual"
          source_run_id=""
          request_id="$MANUAL_REQUEST_ID"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            episode="$(trim "$MANUAL_EPISODE")"
            source_run_id="$(trim "$MANUAL_SOURCE_RUN_ID")"
          else
            if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              mapfile -t trigger_files < <(
                git show --pretty='' --name-only --diff-filter=A "$AFTER_SHA" -- \
                  '.publish-queue/*.txt' '.publish-retry/*.txt'
              )
            else
              mapfile -t trigger_files < <(
                git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- \
                  '.publish-queue/*.txt' '.publish-retry/*.txt'
              )
            fi

            if [[ ${#trigger_files[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one newly added publish trigger file, found ${#trigger_files[@]}."
              exit 1
            fi

            trigger_file="${trigger_files[0]}"
            mapfile -t trigger_values < <(sed 's/\r$//' "$trigger_file")
            first_value="$(trim "${trigger_values[0]:-}")"
            second_value="$(trim "${trigger_values[1]:-}")"
            request_id="$(trim "${trigger_values[2]:-}")"

            case "$trigger_file" in
              .publish-queue/*.txt)
                trigger_kind="queue"
                episode="$(basename "$trigger_file" .txt)"
                source_run_id="$second_value"

                if [[ -n "$first_value" && "$first_value" != "$episode" ]]; then
                  echo "::error::Queue filename slug and first line do not match."
                  exit 1
                fi
                ;;

              .publish-retry/*.txt)
                trigger_kind="retry"
                retry_name="$(basename "$trigger_file" .txt)"
                episode="$first_value"
                source_run_id="$second_value"

                if [[ -z "$episode" ]]; then
                  echo "::error::Retry trigger must contain the episode slug."
                  exit 1
                fi

                if [[ "$retry_name" != "${episode}-retry-1" && "$retry_name" != "${episode}-retry-2" && "$retry_name" != "${episode}-retry-3" ]]; then
                  echo "::error::Retry filename must be <slug>-retry-1.txt, <slug>-retry-2.txt or <slug>-retry-3.txt."
                  exit 1
                fi

                if [[ -z "$source_run_id" ]]; then
                  queue_file=".publish-queue/$episode.txt"
                  if [[ -f "$queue_file" ]]; then
                    mapfile -t queue_values < <(sed 's/\r$//' "$queue_file")
                    queue_episode="$(trim "${queue_values[0]:-}")"
                    source_run_id="$(trim "${queue_values[1]:-}")"
                    if [[ -n "$queue_episode" && "$queue_episode" != "$episode" ]]; then
                      echo "::error::Queue metadata does not match retry episode $episode."
                      exit 1
                    fi
                  fi
                fi
                ;;

              *)
                echo "::error::Unsupported publish trigger path: $trigger_file"
                exit 1
                ;;
            esac
          fi

          if [[ ! "$episode" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]]; then
            echo "::error::Invalid episode slug."
            exit 1
          fi

          if [[ ! "$source_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::PREFLIGHT_ARTIFACT_REQUIRED: source_run_id must identify the successful Episode media preflight that rendered $episode. Run Episode media preflight again instead of rendering inside Publish episode."
            exit 1
          fi

          if [[ ! -d "episodes/$episode" ]]; then
            echo "::error::Episode directory episodes/$episode does not exist."
            exit 1
          fi

          if [[ -n "$request_id" && ! "$request_id" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Invalid request_id."
            exit 1
          fi
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "slug=$episode" >> "$GITHUB_OUTPUT"
          echo "trigger_kind=$trigger_kind" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "Publishing validated artifact: episode=$episode trigger=$trigger_kind source_run=$source_run_id"

      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: PREPARE
          PIPELINE_SLUG: ${{ steps.episode.outputs.slug }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py

      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  publish:
    permissions:
      contents: write
      actions: read
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: publish-episode-${{ needs.prepare.outputs.episode }}
      cancel-in-progress: false
    env:
      EPISODE: ${{ needs.prepare.outputs.episode }}
      SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
      PIPELINE_REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify media preflight artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The queue job dispatches this workflow before its own source run completes.
          # Only this exact run may authorize publication; pending is not failure.
          deadline=$((SECONDS + 900))
          while true; do
            run_info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
              --jq '[.name, .event, .head_branch, .status, (.conclusion // "")] | @tsv')"
            IFS=$'\t' read -r source_name source_event source_branch source_status source_conclusion <<< "$run_info"
            if [[ "$source_name" != "Episode media preflight" || "$source_event" != "push" || "$source_branch" != "main" ]]; then
              echo "::error::PREFLIGHT_ARTIFACT_ORIGIN_INVALID: source must be Episode media preflight push on main."
              exit 1
            fi
            if [[ "$source_status" == "completed" ]]; then
              if [[ "$source_conclusion" != "success" ]]; then
                echo "::error::PREFLIGHT_ARTIFACT_RUN_FAILED: source run concluded $source_conclusion."
                exit 1
              fi
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::PREFLIGHT_SOURCE_TIMEOUT: source run is still $source_status; no publisher started."
              exit 1
            fi
            echo "Waiting for source run $SOURCE_RUN_ID ($source_status)."
            sleep 15
          done

      - name: Download publish-ready artifact from media preflight
        uses: actions/download-artifact@v7
        with:
          name: publish-ready-${{ needs.prepare.outputs.episode }}
          path: .publish-ready
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify immutable preflight snapshot
        id: bundle
        run: python publish.py "$EPISODE" --platform all --dry-run

      - name: Preflight Facebook page credentials before any platform
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          import requests

          token = os.getenv("FACEBOOK_PAGE_ACCESS_TOKEN", "").strip()
          page_id = os.getenv("FACEBOOK_PAGE_ID", "").strip()
          version = os.getenv("META_GRAPH_API_VERSION", "v26.0").strip()

          if not token or not page_id:
              print("::error::FACEBOOK_AUTH_MISSING: FACEBOOK_PAGE_ACCESS_TOKEN/FACEBOOK_PAGE_ID ausentes. Nenhuma plataforma sera publicada.")
              sys.exit(1)

          try:
              response = requests.get(
                  f"https://graph.facebook.com/{version}/{page_id}",
                  params={"fields": "id", "access_token": token},
                  timeout=30,
              )
          except requests.RequestException as exc:
              print(f"::error::FACEBOOK_AUTH_CHECK_UNAVAILABLE: {type(exc).__name__}. Nenhuma plataforma sera publicada.")
              sys.exit(1)

          if response.status_code != 200:
              message = "credencial rejeitada pela Meta"
              try:
                  payload = response.json()
                  error = payload.get("error") if isinstance(payload, dict) else None
                  if isinstance(error, dict):
                      message = str(error.get("message") or message)
              except ValueError:
                  pass
              print(f"::error::FACEBOOK_AUTH_INVALID: HTTP {response.status_code}: {message}. Renove o token antes de publicar; nenhuma plataforma foi chamada.")
              sys.exit(1)

          try:
              payload = response.json()
          except ValueError:
              print("::error::FACEBOOK_AUTH_INVALID: resposta nao-JSON da Meta. Nenhuma plataforma sera publicada.")
              sys.exit(1)

          if str(payload.get("id", "")).strip() != page_id:
              print("::error::FACEBOOK_PAGE_MISMATCH: token nao confirmou a pagina configurada. Nenhuma plataforma sera publicada.")
              sys.exit(1)

          print("FACEBOOK_AUTH_PREFLIGHT=PASS")
          PY

      - name: Upload visual usage history
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: visual-usage-${{ needs.prepare.outputs.episode }}
          path: episodes/${{ needs.prepare.outputs.episode }}/visual_usage.json
          if-no-files-found: warn
          retention-days: 1

      - name: Publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python publish.py "$EPISODE" --platform youtube --live

      - name: Publish to Instagram
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_API_HOST: graph.instagram.com
          META_GRAPH_API_VERSION: v26.0
          INSTAGRAM_VIDEO_HOST: cloudinary
        run: python publish.py "$EPISODE" --platform instagram --live

      - name: Publish to Facebook
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          META_GRAPH_API_VERSION: v26.0
        run: python publish.py "$EPISODE" --platform facebook --live

      - name: Upload TikTok draft
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python publish.py "$EPISODE" --platform tiktok --live

      - name: Persist final publication outcome
        if: always()
        env:
          PUBLICATION_JOB_RESULT: ${{ job.status }}
        run: python scripts/pipeline_workflow.py publisher-result "$EPISODE" --result "$PUBLICATION_JOB_RESULT"

      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: PUBLISH
          PIPELINE_SLUG: ${{ env.EPISODE }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py

      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  persist-visual-usage:
    needs:
      - prepare
      - publish
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download visual usage history
        id: visual_usage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: visual-usage-${{ needs.prepare.outputs.episode }}
          path: episodes/${{ needs.prepare.outputs.episode }}

      - name: Set up Python
        if: ${{ steps.visual_usage.outcome == 'success' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install visual history dependency
        if: ${{ steps.visual_usage.outcome == 'success' }}
        run: python -m pip install Pillow==12.1.1 requests

      - name: Persist visual usage history
        if: ${{ steps.visual_usage.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/persist_visual_usage.py "${{ needs.prepare.outputs.episode }}"

      - name: Write structured workflow diagnostic
        if: always()
        env:
          PIPELINE_STAGE: PERSIST_VISUAL_USAGE
          PIPELINE_SLUG: ${{ needs.prepare.outputs.episode }}
          PIPELINE_JOB_STATUS: ${{ job.status }}
          PIPELINE_STEPS: ${{ toJSON(steps) }}
        run: python scripts/workflow_diagnostic.py

      - name: Upload structured workflow diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostic-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
