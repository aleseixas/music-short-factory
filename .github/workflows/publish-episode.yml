name: Publish episode

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode slug (for example, duckworth)
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".publish-queue/*.txt"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve episode slug
        id: episode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EPISODE: ${{ inputs.episode }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            episode="$(printf '%s' "$MANUAL_EPISODE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          else
            if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              mapfile -t queue_files < <(
                git show --pretty='' --name-only --diff-filter=A "$AFTER_SHA" -- '.publish-queue/*.txt'
              )
            else
              mapfile -t queue_files < <(
                git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '.publish-queue/*.txt'
              )
            fi

            if [[ ${#queue_files[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one newly added .publish-queue/*.txt file, found ${#queue_files[@]}."
              exit 1
            fi

            queue_file="${queue_files[0]}"
            episode="$(basename "$queue_file" .txt)"
            queue_value="$(tr -d '\r\n' < "$queue_file")"

            if [[ -n "$queue_value" && "$queue_value" != "$episode" ]]; then
              echo "::error::Queue filename slug and file contents do not match."
              exit 1
            fi
          fi

          if [[ ! "$episode" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]]; then
            echo "::error::Invalid episode slug."
            exit 1
          fi

          if [[ ! -d "episodes/$episode" ]]; then
            echo "::error::Episode directory episodes/$episode does not exist."
            exit 1
          fi

          echo "EPISODE=$episode" >> "$GITHUB_ENV"
          echo "slug=$episode" >> "$GITHUB_OUTPUT"
          echo "Publishing episode: $episode"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Render episode
        run: python generate.py "$EPISODE"

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v7
        with:
          name: rendered-${{ steps.episode.outputs.slug }}
          path: output/${{ steps.episode.outputs.slug }}.mp4
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Prepare publishing metadata and cover
        run: python prepare_post.py "$EPISODE"

      - name: Publish to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python publish.py "$EPISODE" --platform youtube --live

      - name: Publish to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_API_HOST: graph.instagram.com
          META_GRAPH_API_VERSION: v26.0
          INSTAGRAM_VIDEO_HOST: cloudinary
        run: python publish.py "$EPISODE" --platform instagram --live
