name: Test YouTube auth

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".youtube-auth-test/*.txt"

permissions:
  contents: read

jobs:
  youtube-auth-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Test PO token then cookie fallback
        env:
          PYTHONPATH: .
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_AUTH_TEST_URL: https://www.youtube.com/watch?v=yszWh_7xYrs
        run: python scripts/test_youtube_auth.py
