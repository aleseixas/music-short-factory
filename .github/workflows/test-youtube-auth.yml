name: Test YouTube auth

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".youtube-auth-test/*.txt"

permissions:
  contents: read

jobs:
  youtube-cookie-identity-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Diagnose cookie session identity only
        env:
          PYTHONPATH: .
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python -c "from scripts.test_youtube_auth import _print_cookie_identity_report; _print_cookie_identity_report()"
