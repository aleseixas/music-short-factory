name: Duplicate candidate preflight

on:
  push:
    branches:
      - main
    paths:
      - ".duplicate-check/*.json"

permissions:
  contents: read

jobs:
  duplicate-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve preflight request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t request_files < <(
              git show --pretty='' --name-only --diff-filter=A "$AFTER_SHA" -- '.duplicate-check/*.json'
            )
          else
            mapfile -t request_files < <(
              git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '.duplicate-check/*.json'
            )
          fi

          if [[ ${#request_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one newly added duplicate preflight request, found ${#request_files[@]}."
            exit 1
          fi

          request_file="${request_files[0]}"
          python - "$request_file" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          request_file = Path(sys.argv[1])
          output_file = Path(sys.argv[2])
          data = json.loads(request_file.read_text(encoding="utf-8"))
          song = str(data.get("song", "")).strip()
          artist = str(data.get("artist", "")).strip()
          slug = str(data.get("slug", "")).strip()

          if not song or not artist or not slug:
              raise SystemExit("request precisa conter song, artist e slug nao vazios")
          if not re.fullmatch(r"[a-z0-9]+([_-][a-z0-9]+)*", slug):
              raise SystemExit("slug invalido")

          with output_file.open("a", encoding="utf-8") as handle:
              handle.write(f"song={song}\n")
              handle.write(f"artist={artist}\n")
              handle.write(f"slug={slug}\n")
              handle.write(f"request_file={request_file.as_posix()}\n")
          PY

      - name: Enforce execution continuity and one episode per window
        id: execution_guard
        shell: bash
        env:
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          commit_epoch="$(git show -s --format=%ct "$AFTER_SHA")"
          local_date="$(TZ=America/Sao_Paulo date -d "@$commit_epoch" +%F)"
          local_hour="$(TZ=America/Sao_Paulo date -d "@$commit_epoch" +%H)"
          hour=$((10#$local_hour))

          # Janelas das três execuções diárias do agendamento principal.
          # 08h: 06:00–09:59 | 11h: 10:00–15:59 | 19h: 16:00–23:59.
          if (( hour < 10 )); then
            slot="08"
            slot_start="$local_date 06:00:00 -0300"
          elif (( hour < 16 )); then
            slot="11"
            slot_start="$local_date 10:00:00 -0300"
          else
            slot="19"
            slot_start="$local_date 16:00:00 -0300"
          fi

          mapfile -t queues_in_slot < <(
            git log \
              --since="$slot_start" \
              --until="@$commit_epoch" \
              --diff-filter=A \
              --name-only \
              --format='' \
              -- '.publish-queue/*.txt' \
            | sed '/^[[:space:]]*$/d' \
            | sort -u
          )

          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "slot_start=$slot_start" >> "$GITHUB_OUTPUT"

          if [[ ${#queues_in_slot[@]} -gt 0 ]]; then
            echo "PREFLIGHT_RESULT=EXECUTION_ALREADY_COMPLETED"
            echo "result=EXECUTION_ALREADY_COMPLETED" >> "$GITHUB_OUTPUT"
            echo "::error::A publish queue already exists in scheduled execution window $slot. Refusing a second episode."
            printf 'Existing queue: %s\n' "${queues_in_slot[@]}"
            exit 0
          fi

          # Continuidade entre chamadas/execuções: qualquer episódio novo iniciado
          # depois da publish queue mais recente deve ser concluído antes que uma
          # nova candidata possa ser autorizada.
          latest_queue_commit="$(git log -1 --format=%H --diff-filter=A -- '.publish-queue/*.txt' || true)"

          if [[ -n "$latest_queue_commit" ]]; then
            mapfile -t authored_story_files < <(
              git log "$latest_queue_commit..$AFTER_SHA" \
                --diff-filter=A \
                --name-only \
                --format='' \
                -- 'episodes/*/story.json' \
              | sed '/^[[:space:]]*$/d' \
              | sort -u
            )
          else
            mapfile -t authored_story_files < <(
              git log "$AFTER_SHA" \
                --diff-filter=A \
                --name-only \
                --format='' \
                -- 'episodes/*/story.json' \
              | sed '/^[[:space:]]*$/d' \
              | sort -u
            )
          fi

          # Um media preflight criado na janela atual também é evidência forte de
          # continuidade, inclusive se a autoria começou pouco antes da janela.
          mapfile -t episode_checks_in_slot < <(
            git log \
              --since="$slot_start" \
              --until="@$commit_epoch" \
              --diff-filter=A \
              --name-only \
              --format='' \
              -- '.episode-check/*.json' \
            | sed '/^[[:space:]]*$/d' \
            | sort -u
          )

          declare -A active_slug_map=()

          for story_file in "${authored_story_files[@]}"; do
            slug="${story_file#episodes/}"
            slug="${slug%/story.json}"
            if [[ "$slug" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]] \
              && [[ -f "episodes/$slug/story.json" ]] \
              && [[ ! -f ".publish-queue/$slug.txt" ]]; then
              active_slug_map["$slug"]=1
            fi
          done

          for check_file in "${episode_checks_in_slot[@]}"; do
            [[ -f "$check_file" ]] || continue
            slug="$(python - "$check_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              print("")
              raise SystemExit(0)
          print(str(data.get("slug", "")).strip())
          PY
            )"
            if [[ "$slug" =~ ^[a-z0-9]+([_-][a-z0-9]+)*$ ]] \
              && [[ -f "episodes/$slug/story.json" ]] \
              && [[ ! -f ".publish-queue/$slug.txt" ]]; then
              active_slug_map["$slug"]=1
            fi
          done

          active_slugs=()
          if (( ${#active_slug_map[@]} > 0 )); then
            mapfile -t active_slugs < <(printf '%s\n' "${!active_slug_map[@]}" | sort)
          fi

          continuity_slugs=""
          if (( ${#active_slugs[@]} > 0 )); then
            continuity_slugs="$(IFS=,; echo "${active_slugs[*]}")"
          fi
          echo "continuity_slugs=$continuity_slugs" >> "$GITHUB_OUTPUT"

          if [[ ${#active_slugs[@]} -eq 1 ]]; then
            resume_slug="${active_slugs[0]}"
            echo "PREFLIGHT_RESULT=RESUME_EXISTING_EPISODE"
            echo "RESUME_SLUG=$resume_slug"
            echo "result=RESUME_EXISTING_EPISODE" >> "$GITHUB_OUTPUT"
            echo "resume_slug=$resume_slug" >> "$GITHUB_OUTPUT"
            echo "::warning::Episode $resume_slug was already started and has no publish queue. Ignore the new candidate and resume this slug until media preflight PASS and queue creation."
            exit 0
          fi

          if [[ ${#active_slugs[@]} -gt 1 ]]; then
            echo "PREFLIGHT_RESULT=CONTINUITY_CONFLICT"
            echo "result=CONTINUITY_CONFLICT" >> "$GITHUB_OUTPUT"
            echo "::error::Multiple unfinished episodes were found. Refusing to authorize another candidate."
            printf 'Unfinished episode: %s\n' "${active_slugs[@]}"
            exit 0
          fi

          echo "result=OPEN" >> "$GITHUB_OUTPUT"
          echo "Execution window $slot is open and no unfinished episode is pending."

      - name: Check candidate duplicate
        id: duplicate
        if: ${{ steps.execution_guard.outputs.result == 'OPEN' }}
        shell: bash
        env:
          SONG: ${{ steps.request.outputs.song }}
          ARTIST: ${{ steps.request.outputs.artist }}
          SLUG: ${{ steps.request.outputs.slug }}
        run: |
          set +e
          output="$(python check_duplicate.py --song "$SONG" --artist "$ARTIST" --slug "$SLUG" 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [[ $status -eq 0 ]]; then
            echo "PREFLIGHT_RESULT=UNIQUE_CANDIDATE"
            echo "result=UNIQUE_CANDIDATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ $status -eq 2 ]]; then
            echo "PREFLIGHT_RESULT=DUPLICATE_CANDIDATE"
            echo "result=DUPLICATE_CANDIDATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Duplicate preflight infrastructure failed with exit code $status."
          exit "$status"

      - name: Write preflight summary
        if: always()
        shell: bash
        env:
          GUARD_RESULT: ${{ steps.execution_guard.outputs.result }}
          DUPLICATE_RESULT: ${{ steps.duplicate.outputs.result }}
          SLOT: ${{ steps.execution_guard.outputs.slot }}
          RESUME_SLUG: ${{ steps.execution_guard.outputs.resume_slug }}
          CONTINUITY_SLUGS: ${{ steps.execution_guard.outputs.continuity_slugs }}
          SONG: ${{ steps.request.outputs.song }}
          ARTIST: ${{ steps.request.outputs.artist }}
          SLUG: ${{ steps.request.outputs.slug }}
        run: |
          result="$GUARD_RESULT"
          if [[ "$GUARD_RESULT" == "OPEN" ]]; then
            result="$DUPLICATE_RESULT"
          fi
          {
            echo "## Duplicate candidate preflight"
            echo
            echo "- Result: ${result:-INFRA_FAILURE}"
            echo "- Scheduled window: ${SLOT:-N/A}"
            echo "- Requested song: $SONG"
            echo "- Requested artist: $ARTIST"
            echo "- Requested slug: $SLUG"
            echo "- Resume slug: ${RESUME_SLUG:-N/A}"
            echo "- Continuity slugs: ${CONTINUITY_SLUGS:-N/A}"
          } >> "$GITHUB_STEP_SUMMARY"
