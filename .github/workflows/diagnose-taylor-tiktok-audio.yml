name: Diagnose Taylor TikTok audio

on:
  push:
    branches:
      - main
    paths:
      - ".publish-tiktok-audio-diagnosis/lei_taylor_swift_brasil_agua_shows.txt"

permissions:
  contents: read

env:
  EPISODE: lei_taylor_swift_brasil_agua_shows

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Save original timeline and post
        shell: bash
        run: |
          cp "episodes/$EPISODE/timeline.json" /tmp/timeline-original.json
          cp "episodes/$EPISODE/post.json" /tmp/post-original.json

      - name: Build TEST A - music only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          episode = "lei_taylor_swift_brasil_agua_shows"
          path = Path("episodes") / episode / "timeline.json"
          data = json.loads(Path("/tmp/timeline-original.json").read_text(encoding="utf-8"))
          data["sfx_cues"] = []
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("TEST A: Gemini narration + original background music; SFX disabled.")
          PY
          python generate.py "$EPISODE"
          cp "output/$EPISODE.mp4" "output/${EPISODE}_TEST_A_MUSIC_ONLY.mp4"

      - name: Upload TEST A - music only to TikTok draft
        shell: bash
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          cp "output/${EPISODE}_TEST_A_MUSIC_ONLY.mp4" "output/$EPISODE.mp4"
          cp /tmp/post-original.json "episodes/$EPISODE/post.json"
          python - <<'PY'
          import json
          from pathlib import Path
          episode = "lei_taylor_swift_brasil_agua_shows"
          path = Path("episodes") / episode / "post.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          data["tiktok"]["caption"] = "TESTE A — SÓ MÚSICA — não publicar"
          data["tiktok"]["hashtags"] = []
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python prepare_post.py "$EPISODE"
          python publish.py "$EPISODE" --platform tiktok --live

      - name: Build TEST B - SFX only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          episode = "lei_taylor_swift_brasil_agua_shows"
          path = Path("episodes") / episode / "timeline.json"
          data = json.loads(Path("/tmp/timeline-original.json").read_text(encoding="utf-8"))
          data.pop("background_music", None)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("TEST B: Gemini narration + original SFX; background music disabled.")
          PY
          python generate.py "$EPISODE"
          cp "output/$EPISODE.mp4" "output/${EPISODE}_TEST_B_SFX_ONLY.mp4"

      - name: Upload TEST B - SFX only to TikTok draft
        shell: bash
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          cp "output/${EPISODE}_TEST_B_SFX_ONLY.mp4" "output/$EPISODE.mp4"
          cp /tmp/post-original.json "episodes/$EPISODE/post.json"
          python - <<'PY'
          import json
          from pathlib import Path
          episode = "lei_taylor_swift_brasil_agua_shows"
          path = Path("episodes") / episode / "post.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          data["tiktok"]["caption"] = "TESTE B — SÓ SFX — não publicar"
          data["tiktok"]["hashtags"] = []
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python prepare_post.py "$EPISODE"
          python publish.py "$EPISODE" --platform tiktok --live

      - name: Upload diagnostic MP4s
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tiktok-audio-diagnosis-${{ env.EPISODE }}
          path: |
            output/${{ env.EPISODE }}_TEST_A_MUSIC_ONLY.mp4
            output/${{ env.EPISODE }}_TEST_B_SFX_ONLY.mp4
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
