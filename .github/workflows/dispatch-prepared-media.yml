name: Dispatch prepared media preflight

on:
  push:
    branches:
      - main
    paths:
      - ".media-dispatch/*.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: media-dispatch-main
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve prepared request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA" -- '.media-dispatch/*.json')
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::MEDIA_DISPATCH_INVALID: expected exactly one new request; found ${#files[@]}"
            exit 1
          fi
          python - "${files[0]}" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          episode=str(data.get("episode","")).strip()
          request_id=str(data.get("request_id","")).strip()
          source_sha=str(data.get("source_sha","")).strip()
          if not re.fullmatch(r"[a-z0-9]+([_-][a-z0-9]+)*",episode): raise SystemExit("invalid episode")
          if not re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9_-]{0,159}",request_id): raise SystemExit("invalid request_id")
          if not re.fullmatch(r"[0-9a-fA-F]{40}",source_sha): raise SystemExit("invalid source_sha")
          with open(sys.argv[2],"a",encoding="utf-8") as h:
              h.write(f"episode={episode}\nrequest_id={request_id}\nsource_sha={source_sha}\n")
          PY

      - name: Verify prepared request at exact CAS commit
        env:
          EPISODE: ${{ steps.request.outputs.episode }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          path=".episode-check/${EPISODE}--${REQUEST_ID}.json"
          git cat-file -e "${SOURCE_SHA}:${path}"
          body="$(git show "${SOURCE_SHA}:${path}")"
          python - "$body" "$EPISODE" "$REQUEST_ID" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("slug") != sys.argv[2] or d.get("request_id") != sys.argv[3] or d.get("local_preflight_passed") is not True:
              raise SystemExit("prepared request identity/local gate mismatch")
          PY

      - name: Dispatch exact media preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ steps.request.outputs.episode }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh workflow run episode-media-preflight.yml --ref main \
            -f episode="$EPISODE" \
            -f request_id="$REQUEST_ID" \
            -f source_sha="$SOURCE_SHA"
