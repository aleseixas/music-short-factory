name: Test background music freshness

on:
  push:
    branches:
      - main
    paths:
      - "engine/music.py"
      - "check_episode_media.py"
      - "tests/test_background_music_freshness.py"
      - ".github/workflows/test-background-music-freshness.yml"

permissions:
  contents: read

jobs:
  test-background-music-freshness:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run background music freshness tests
        run: python -m unittest tests.test_music_profile_resilience tests.test_background_music_freshness
