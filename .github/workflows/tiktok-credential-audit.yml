name: TikTok credential audit
on:
  push:
    branches:
      - tiktok-credential-audit-20260925
    paths:
      - .github/workflows/tiktok-credential-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint TikTok credentials
        shell: bash
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, sys
          vals = {
              "CLIENT_KEY": os.getenv("TIKTOK_CLIENT_KEY", ""),
              "CLIENT_SECRET": os.getenv("TIKTOK_CLIENT_SECRET", ""),
              "REFRESH_TOKEN": os.getenv("TIKTOK_REFRESH_TOKEN", ""),
          }
          missing = [k for k,v in vals.items() if not v]
          if missing:
              print("MISSING=" + ",".join(missing))
              sys.exit(2)
          for k,v in vals.items():
              print(f"{k}_FP={hashlib.sha256(v.encode()).hexdigest()[:16]}")
          print("ALL_PRESENT=YES")
          PY
