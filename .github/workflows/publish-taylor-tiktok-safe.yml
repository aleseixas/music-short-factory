name: Publish Taylor TikTok safe

on:
  push:
    branches:
      - main
    paths:
      - ".publish-tiktok-safe/lei_taylor_swift_brasil_agua_shows.txt"

permissions:
  contents: read

env:
  EPISODE: lei_taylor_swift_brasil_agua_shows

jobs:
  publish-tiktok-safe:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Make temporary TikTok-safe audio plan
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          episode = "lei_taylor_swift_brasil_agua_shows"
          path = Path("episodes") / episode / "timeline.json"
          data = json.loads(path.read_text(encoding="utf-8"))

          # TikTok-safe one-off render: keep the Gemini narration, but remove
          # every external music/SFX layer so TikTok has no third-party sound
          # fingerprint to match. This changes only the Actions workspace;
          # the episode's committed timeline remains untouched.
          data.pop("background_music", None)
          data["sfx_cues"] = []

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("TikTok-safe audio plan: narration only; background music and SFX disabled.")
          PY

      - name: Render TikTok-safe episode
        run: python generate.py "$EPISODE"

      - name: Upload TikTok-safe MP4 artifact
        uses: actions/upload-artifact@v7
        with:
          name: rendered-${{ env.EPISODE }}-tiktok-safe
          path: output/${{ env.EPISODE }}.mp4
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Prepare publishing metadata and cover
        run: python prepare_post.py "$EPISODE"

      - name: Upload TikTok draft only
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python publish.py "$EPISODE" --platform tiktok --live
