name: Actions artifact storage smoke test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/storage-smoke-test.yml"

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create tiny probe
        run: printf 'artifact-storage-ok\n' > storage-probe.txt

      - name: Upload tiny probe
        uses: actions/upload-artifact@v7
        with:
          name: storage-probe-${{ github.run_id }}
          path: storage-probe.txt
          retention-days: 1

      - name: Delete probe immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: storage-probe-${{ github.run_id }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" | head -n 1)"
          test -n "$artifact_id"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          echo "ARTIFACT_STORAGE_SMOKE_OK"
