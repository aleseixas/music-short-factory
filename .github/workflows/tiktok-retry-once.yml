name: Retry TikTok only

on:
  push:
    branches:
      - main
    paths:
      - ".publish-tiktok-retry/beat_it_michael_jackson-polling-test.txt"

permissions:
  contents: read
  actions: read

env:
  EPISODE: beat_it_michael_jackson
  SOURCE_RUN_ID: "33828058837"

jobs:
  publish-tiktok:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download rendered MP4 from original run
        uses: actions/download-artifact@v7
        with:
          name: rendered-${{ env.EPISODE }}
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Create validation cover from rendered video
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -ss 1 -i "output/${EPISODE}.mp4" -frames:v 1 \
            "output/${EPISODE}_cover.jpg"
          test -s "output/${EPISODE}_cover.jpg"

      - name: Upload TikTok draft only
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python publish.py "$EPISODE" --platform tiktok --live
