name: Temporary history cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-history.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Rewrite history without generated media
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_URL="$(git remote get-url origin)"

          python -m pip install --disable-pip-version-check git-filter-repo

          git filter-repo --force --invert-paths \
            --path-glob 'episodes/*/assets/*.jpg' \
            --path-glob 'episodes/*/assets/*.JPG' \
            --path-glob 'episodes/*/assets/*.jpeg' \
            --path-glob 'episodes/*/assets/*.JPEG' \
            --path 'tests/reference/through_the_wire_v7.mp4'

          git remote add origin "$REMOTE_URL"

          printf '\n# Episode images are downloaded from assets.json URLs at render time\n' >> .gitignore
          printf 'episodes/*/assets/*.jpg\n' >> .gitignore
          printf 'episodes/*/assets/*.JPG\n' >> .gitignore
          printf 'episodes/*/assets/*.jpeg\n' >> .gitignore
          printf 'episodes/*/assets/*.JPEG\n' >> .gitignore
          printf 'tests/reference/*.mp4\n' >> .gitignore

          git rm --ignore-unmatch .github/workflows/cleanup-history.yml
          git add .gitignore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clean generated media from Git history'

          git push --force origin HEAD:main
