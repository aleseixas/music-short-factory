name: One-shot strengthen visual repetition

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-strengthen-visual-repetition.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install -r requirements.txt

      - name: Apply repetition hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "engine/visual_repetition.py",
              "DEFAULT_RECENT_EPISODE_LIMIT = 24",
              "# Keep effectively the full project history by default; explicit callers can still request a smaller window.\nDEFAULT_RECENT_EPISODE_LIMIT = 10_000",
          )

          old = (
              "        detected: list[tuple[str, float]] = []\n"
              "        overlap = _source_overlap(candidate, previous) if candidate.kind == \"video\" else 1.0\n"
              "        if overlap > 0 and set(candidate.url_hashes).intersection(previous.url_hashes):\n"
              "            detected.append((\"url\", overlap))\n"
              "        if overlap > 0 and candidate.sha256 and candidate.sha256 == previous.sha256:\n"
              "            detected.append((\"sha256\", overlap))\n"
          )
          new = (
              "        detected: list[tuple[str, float]] = []\n"
              "        overlap = _source_overlap(candidate, previous) if candidate.kind == \"video\" else 1.0\n"
              "        same_url = bool(set(candidate.url_hashes).intersection(previous.url_hashes))\n"
              "        same_sha = bool(candidate.sha256 and candidate.sha256 == previous.sha256)\n"
              "        # For video, the same source is repetition even when a different trim is used.\n"
              "        # Exact source identity must therefore remain strong for legacy entries that do\n"
              "        # not know the consumed duration and for non-overlapping trims of the same file.\n"
              "        if same_url:\n"
              "            detected.append((\"url\", 1.0 if candidate.kind == \"video\" else overlap))\n"
              "        if same_sha:\n"
              "            detected.append((\"sha256\", 1.0 if candidate.kind == \"video\" else overlap))\n"
          )
          replace_once("engine/visual_repetition.py", old, new)

          old = (
              "        factor = _recency_factor(raw_entry.recency_rank)\n"
              "        usage_key = (raw_entry.episode, raw_entry.shot_id, raw_entry.asset_id)\n"
              "        for method, similarity in detected:\n"
              "            penalty = -round(base_penalties[method] * factor * similarity, 2)\n"
          )
          new = (
              "        factor = _recency_factor(raw_entry.recency_rank)\n"
              "        usage_key = (raw_entry.episode, raw_entry.shot_id, raw_entry.asset_id)\n"
              "        for method, similarity in detected:\n"
              "            exact_video_source = candidate.kind == \"video\" and method in {\"url\", \"sha256\"}\n"
              "            effective_factor = 1.0 if exact_video_source else factor\n"
              "            effective_base = MAX_REPETITION_PENALTY if exact_video_source else base_penalties[method]\n"
              "            penalty = -round(effective_base * effective_factor * similarity, 2)\n"
          )
          replace_once("engine/visual_repetition.py", old, new)

          old = (
              "        for match in assessment.matches:\n"
              "            self.assertAlmostEqual(match.similarity, 0.5)\n"
              "        self.assertFalse(assessment.blocked)\n"
          )
          new = (
              "        for match in assessment.matches:\n"
              "            self.assertEqual(match.similarity, 1.0)\n"
              "        self.assertEqual(assessment.penalty, -MAX_REPETITION_PENALTY)\n"
              "        self.assertFalse(assessment.blocked)\n"
          )
          replace_once("tests/test_visual_repetition.py", old, new)

          old = (
              "        assessment = assess_repetition(candidate, (_entry(prior),))\n"
              "        self.assertFalse(assessment.is_repeated)\n"
              "        self.assertEqual(assessment.matches, ())\n"
              "        self.assertEqual(assessment.penalty, 0)\n"
          )
          new = (
              "        assessment = assess_repetition(candidate, (_entry(prior),))\n"
              "        self.assertTrue(assessment.is_repeated)\n"
              "        self.assertEqual(_methods(assessment), {\"url\", \"sha256\"})\n"
              "        self.assertTrue(all(match.similarity == 1.0 for match in assessment.matches))\n"
              "        self.assertEqual(assessment.penalty, -MAX_REPETITION_PENALTY)\n"
          )
          replace_once("tests/test_visual_repetition.py", old, new)

          old = (
              "        prior = self._fingerprint(0, 1)\n"
              "        candidate = self._fingerprint(1, 1)\n"
              "        self.assertFalse(assess_repetition(candidate, (_entry(prior),)).is_repeated)\n"
          )
          new = (
              "        prior = self._fingerprint(0, 1)\n"
              "        candidate = self._fingerprint(1, 1)\n"
              "        assessment = assess_repetition(candidate, (_entry(prior),))\n"
              "        self.assertTrue(assessment.is_repeated)\n"
              "        self.assertEqual(assessment.penalty, -MAX_REPETITION_PENALTY)\n"
          )
          replace_once("tests/test_visual_repetition.py", old, new)

          old = (
              "        self.assertTrue(weak.is_repeated)\n"
              "        self.assertGreater(weak.penalty, exact.penalty)\n"
              "        self.assertGreater(weak.matches[0].similarity, 0)\n"
              "        self.assertLess(weak.matches[0].similarity, 1)\n"
          )
          new = (
              "        self.assertTrue(weak.is_repeated)\n"
              "        self.assertEqual(weak.penalty, -MAX_REPETITION_PENALTY)\n"
              "        self.assertEqual(exact.penalty, -MAX_REPETITION_PENALTY)\n"
              "        self.assertTrue(all(match.similarity == 1.0 for match in weak.matches))\n"
          )
          replace_once("tests/test_visual_repetition.py", old, new)

          replace_once(
              "docs/visual-search.md",
              "A janela padrão é de 24 episódios com histórico.",
              "A janela padrão cobre efetivamente todo o histórico do projeto (até 10.000 episódios). Para vídeos, URL ou SHA-256 exatos recebem a penalidade máxima de repetição (-70), mesmo com outro trim e independentemente da recência.",
          )
          PY

      - name: Run targeted tests
        run: |
          python -m unittest tests.test_visual_repetition tests.test_visual_repetition_integration
          git diff --check

      - name: Commit hardened behavior
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-strengthen-visual-repetition.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/visual_repetition.py tests/test_visual_repetition.py docs/visual-search.md .github/workflows/one-shot-strengthen-visual-repetition.yml
          git commit -m "Strengthen repeated video source penalties"
          git pull --rebase origin main
          git push origin HEAD:main
