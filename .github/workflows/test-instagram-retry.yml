name: Test Instagram retry

on:
  push:
    branches:
      - main
    paths:
      - "publish.py"
      - "publishing/instagram.py"
      - "publishing/base.py"
      - "publishing/credentials.py"
      - "tests/test_instagram_retry.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-instagram-retry:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Instagram retry tests
        run: python -m unittest tests.test_instagram_retry -v
